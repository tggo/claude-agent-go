<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>graph web</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0A1320; --ink-2:#0E1B2A; --ink-3:#13263A; --cyan:#3DD6F5; --cyan-deep:#00ADD8;
  --coral:#FF6B5C; --amber:#F2C14E; --green:#58D68D; --text:#E7EFF6; --muted:#8499AB; --faint:#54677A; --line:#1C3047;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace; --disp:'Space Grotesk',system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--text);font-family:var(--disp);font-size:14px;overflow:hidden}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-rows:auto 1fr auto;height:100vh}
header{display:flex;align-items:center;gap:18px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--ink-2);flex-wrap:wrap}
.brand{font-family:var(--mono);font-weight:600;letter-spacing:-.02em}
.brand b{color:var(--cyan)}
.pill{font-family:var(--mono);font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.pill.running{color:var(--cyan);border-color:var(--cyan)}
.pill.waiting,.pill.paused{color:var(--amber);border-color:var(--amber)}
.pill.done{color:var(--green);border-color:var(--green)}
.pill.failed,.pill.error,.pill.cancelled,.pill.max_steps{color:var(--coral);border-color:var(--coral)}
.stat{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.stat b{color:var(--text);font-weight:500}
.path{font-family:var(--mono);font-size:12px;color:var(--muted);max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.path i{font-style:normal;color:var(--faint)}
.spacer{flex:1}
.btn{background:var(--ink-3);border:1px solid var(--line);border-radius:7px;padding:4px 12px;cursor:pointer;font-family:var(--mono);font-size:12.5px}
.btn:hover{border-color:var(--cyan)}
.btn.primary{border-color:var(--cyan-deep);color:var(--cyan)}
.btn.warn{border-color:var(--amber);color:var(--amber)}
.btn:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
main{display:grid;grid-template-columns:1fr 440px;min-height:0}
#stage{position:relative;min-width:0;min-height:0;background:radial-gradient(circle at 1px 1px,#16283b 1px,transparent 0) 0 0/24px 24px}
#svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#svg.panning{cursor:grabbing}
aside{border-left:1px solid var(--line);background:var(--ink-2);display:flex;flex-direction:column;min-height:0}
.ph{padding:12px 14px 6px;border-bottom:1px solid var(--line)}
.ph h2{margin:0;font-size:16px;font-weight:600}
.ph .sub{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:2px}
.tabs{display:flex;gap:2px;padding:6px 10px 0;border-bottom:1px solid var(--line)}
.tab{white-space:nowrap;padding:6px 9px;border:0;background:none;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;font-family:var(--mono);font-size:12.5px}
.tab.on{color:var(--cyan);border-bottom-color:var(--cyan)}
#panel{overflow:auto;padding:12px 14px;flex:1;min-height:0}
.muted{color:var(--muted)}
.ev{border-left:2px solid var(--line);padding:2px 0 2px 10px;margin:0 0 10px}
.ev .k{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.ev.text{border-color:var(--cyan)} .ev.tool_use{border-color:var(--amber)} .ev.tool_result{border-color:var(--faint)}
.ev.err{border-color:var(--coral)} .ev.result{border-color:var(--green)} .ev.marker{border-color:var(--amber)}
.ev pre,.val{margin:4px 0 0;white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:12px;line-height:1.5}
.ev .tool{font-family:var(--mono);color:var(--amber);font-size:12.5px}
details>summary{cursor:pointer;color:var(--muted);font-family:var(--mono);font-size:12px}
.kv{margin:0 0 14px}
.kv .key{font-family:var(--mono);font-size:12px;color:var(--cyan);margin-bottom:2px}
.kv .val{background:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px 8px;max-height:260px;overflow:auto}
.kv .val.before{border-color:#5a2a2a;background:#1a1114} .kv .val.after{border-color:#1d4f59;background:#0b1c22}
.kv .tag{font-family:var(--mono);font-size:10.5px;color:var(--faint);text-transform:uppercase;margin:6px 0 2px}
.steps{display:flex;flex-direction:column;gap:6px}
.step{display:flex;gap:10px;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--ink);cursor:pointer;font-family:var(--mono);font-size:12.5px}
.step.on{border-color:var(--cyan)} .step:hover{border-color:var(--cyan-deep)}
.step .st{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.step .st.done{background:var(--green)} .step .st.running{background:var(--cyan)} .step .st.failed{background:var(--coral)} .step .st.waiting{background:var(--amber)}
/* bottom */
footer{border-top:1px solid var(--line);background:var(--ink-2)}
.scrub{display:flex;align-items:center;gap:12px;padding:8px 16px}
.scrub input[type=range]{flex:1;accent-color:var(--cyan)}
.scrub label{font-family:var(--mono);font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.scrub select{background:var(--ink-3);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
#log{height:170px;overflow:auto;font-family:var(--mono);font-size:12px;border-top:1px solid var(--line)}
.row{display:flex;gap:10px;padding:2px 16px;cursor:pointer;white-space:nowrap;align-items:baseline}
.row:hover{background:var(--ink-3)} .row.sel{background:#102a3a}
.row .n{width:46px;color:var(--faint);text-align:right;flex:none}
.row .t{width:58px;color:var(--faint);flex:none}
.row .ty{width:110px;flex:none;color:var(--muted)}
.row .ty.artifact{color:var(--green)} .row .ty.node_start,.row .ty.node_end{color:var(--cyan)} .row .ty.edge{color:#9fb4c7} .row .ty.interrupt,.row .ty.breakpoint_hit,.row .ty.resume{color:var(--amber)}
.row .ty.graph_end.ok{color:var(--green)} .row .ty.err{color:var(--coral)}
.row .d{overflow:hidden;text-overflow:ellipsis}
/* artifacts */
#gal{border-top:1px solid var(--line);padding:6px 16px 8px;overflow-x:auto;white-space:nowrap}
#gal .gi{display:inline-block;vertical-align:top;width:112px;margin-right:10px;cursor:pointer;white-space:normal;border:1px solid var(--line);border-radius:8px;background:var(--ink);overflow:hidden;position:relative}
#gal .gi:hover,#gal .gi.sel{border-color:var(--cyan)}
#gal .gi img{display:block;width:100%;height:78px;object-fit:cover;background:var(--ink-3)}
#gal .gi .gl{padding:3px 6px 4px;font-family:var(--mono);font-size:10.5px;line-height:1.35;color:var(--muted);overflow:hidden;max-height:4.1em}
#gal .gi .gl b{color:var(--text);font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#gal .gi .zoom{position:absolute;top:3px;right:3px;padding:0 6px;font-size:12px;line-height:18px;background:rgba(10,19,32,.8)}
.art{margin:0 0 14px;border:1px solid var(--line);border-radius:8px;background:var(--ink);padding:8px}
.art img{display:block;max-width:100%;max-height:300px;margin:0 auto 6px;cursor:zoom-in;border-radius:4px;background:var(--ink-3)}
.art .an{font-family:var(--mono);font-size:12px;color:var(--cyan)}
.art .ac{font-size:12.5px;color:var(--muted);margin-top:2px}
.art .am{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:2px}
.art a{color:var(--cyan);font-family:var(--mono);font-size:12px}
.art pre{margin:6px 0 0;max-height:300px;overflow:auto;white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:12px;background:var(--ink-2);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
#lb{position:fixed;inset:0;z-index:50;background:rgba(5,10,18,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px}
#lb img{max-width:94vw;max-height:80vh;object-fit:contain;border-radius:6px;box-shadow:0 10px 50px rgba(0,0,0,.6)}
#lb .lc{font-family:var(--mono);font-size:13px;color:var(--text);text-align:center;max-width:80vw}
#lb .lc span{color:var(--muted)}
#lb .nav{position:absolute;top:50%;transform:translateY(-50%);font-size:22px;padding:8px 14px}
#lb .nav.l{left:16px} #lb .nav.r{right:16px} #lb .x{position:absolute;top:14px;right:16px}
#ask.review{position:fixed;inset:10px;left:10px;bottom:10px;transform:none;max-width:none;width:auto;z-index:40;display:flex;flex-direction:column;gap:10px;border-color:var(--cyan-deep)}
#ask.review .q{margin:0}
.rgrid{overflow:auto;flex:1;min-height:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:12px;align-content:start}
.rc{border:1px solid var(--line);border-radius:10px;background:var(--ink);padding:8px;display:flex;flex-direction:column;gap:6px}
.rc img{display:block;width:100%;height:auto;border-radius:6px;background:var(--ink-3);cursor:zoom-in}
.rc .rn{font-family:var(--mono);font-size:12.5px;color:var(--cyan)}
.rc .ac{font-size:12.5px;color:var(--muted)}
#ask textarea{width:100%;background:var(--ink-2);border:1px solid var(--line);border-radius:7px;padding:6px 10px;resize:vertical;font-family:var(--disp)}
#ask textarea:focus-visible{border-color:var(--cyan)}
.rfoot{display:flex;flex-direction:column;gap:8px}
.rfoot .row2{display:flex;gap:8px;justify-content:flex-end}
.rthumbs{display:flex;gap:8px;overflow-x:auto;margin:0 0 8px}
.rthumbs img{height:64px;border-radius:5px;cursor:zoom-in}
/* svg */
.node rect.box{fill:var(--ink-2);stroke:var(--line);stroke-width:1.5}
.node.agent rect.box{fill:#0f2233;stroke:#27506a}
.node .accent{fill:var(--cyan-deep);opacity:.0}
.node.agent .accent{opacity:.9}
.node text{fill:var(--text);font-family:var(--disp)}
.node text.name{font-weight:600;font-size:14.5px}
.node text.meta{font-family:var(--mono);font-size:12px;fill:var(--muted)}
.node.idle{opacity:.72}
.node.running rect.box{stroke:var(--cyan);stroke-width:2.2;animation:pulse 1.1s ease-in-out infinite}
.node.done rect.box{stroke:#2c7f8f}
.node.failed rect.box{stroke:var(--coral);stroke-width:2.2;fill:#2a1519}
.node.waiting rect.box,.node.paused rect.box{stroke:var(--amber);stroke-width:2.2}
.node.sel rect.box{filter:drop-shadow(0 0 7px rgba(61,214,245,.55))}
.node.start circle,.node.end circle{fill:var(--ink-3);stroke:var(--faint);stroke-width:1.5}
.node.end circle.in{fill:var(--faint)} .node.start text,.node.end text{font-family:var(--mono);font-size:10px;fill:var(--muted)}
.node.end.reached circle{stroke:var(--green)} .node.end.reached circle.in{fill:var(--green)}
.node.end.bad circle{stroke:var(--coral)} .node.end.bad circle.in{fill:var(--coral)}
.node{cursor:pointer}
.bp{fill:var(--ink);stroke:var(--faint);stroke-width:1.5;cursor:pointer}
.bp.on{fill:var(--coral);stroke:var(--coral)}
.node:hover .bp{stroke:var(--coral)}
.vis{font-family:var(--mono);font-size:11.5px;fill:var(--amber)!important}
.lane{fill:rgba(61,214,245,.03);stroke:#1d3a50;stroke-dasharray:3 5;stroke-width:1}
.lane-label{fill:var(--faint);font-family:var(--mono);font-size:11px}
.edge path{fill:none;stroke:#2c4258;stroke-width:1.6;marker-end:url(#arrow)}
.edge.cond path{stroke-dasharray:6 5}
.edge.branch path{stroke-dasharray:2 4}
.edge.taken path{stroke:#3a8aa0;marker-end:url(#arrow-taken)}
.edge.hot path{stroke:var(--cyan);stroke-width:2.6;marker-end:url(#arrow-hot)}
.edge text{font-family:var(--mono);font-size:11.5px;fill:var(--muted)}
.edge .lbg{fill:var(--ink);opacity:.85}
.edge .badge rect{fill:var(--ink-3);stroke:var(--amber);stroke-width:1}
.edge .badge text{fill:var(--amber);font-weight:600}
.packet circle{fill:var(--cyan);filter:drop-shadow(0 0 5px var(--cyan))}
.packet rect{fill:#0b2231;stroke:var(--cyan);stroke-width:1}
.packet text{font-family:var(--mono);font-size:10.5px;fill:var(--text)}
@keyframes pulse{0%,100%{filter:drop-shadow(0 0 0 rgba(61,214,245,0))}50%{filter:drop-shadow(0 0 9px rgba(61,214,245,.8))}}
@media (prefers-reduced-motion:reduce){.node.running rect.box{animation:none}}
/* overlays */
.overlay{position:absolute;left:50%;transform:translateX(-50%);background:var(--ink-2);border:1px solid var(--amber);border-radius:12px;padding:12px 16px;box-shadow:0 10px 40px rgba(0,0,0,.5);max-width:min(640px,92%);z-index:5}
#ask{bottom:18px} #bpb{top:54px;display:flex;gap:12px;align-items:center}
#ask .q{white-space:pre-wrap;margin:0 0 10px;font-size:14.5px}
#ask .row2{display:flex;gap:8px}
#ask input{flex:1;background:var(--ink);border:1px solid var(--line);border-radius:7px;padding:6px 10px}
.toolbar{position:absolute;right:12px;top:10px;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px;z-index:4;max-width:calc(100% - 24px)}
.toolbar .btn{padding:3px 9px;font-size:12px;background:rgba(14,27,42,.94)}
.toolbar .btn[aria-pressed=true]{border-color:var(--cyan-deep);color:var(--cyan)}
.seg{display:inline-flex;border-radius:7px;overflow:hidden}
.seg .btn{border-radius:0;border-right-width:0}.seg .btn:first-child{border-radius:7px 0 0 7px}.seg .btn:last-child{border-radius:0 7px 7px 0;border-right-width:1px}
#mini{position:absolute;right:12px;bottom:12px;z-index:3;background:rgba(10,19,32,.92);border:1px solid var(--line);border-radius:8px;cursor:pointer;touch-action:none;box-shadow:0 4px 18px rgba(0,0,0,.4)}
#mini .mg{fill:rgba(61,214,245,.06);stroke:#27506a;stroke-width:1;vector-effect:non-scaling-stroke}
#mini .mn{fill:#2a3d52}#mini .mn.running{fill:var(--cyan)}#mini .mn.done{fill:#2c7f8f}#mini .mn.failed{fill:var(--coral)}#mini .mn.waiting,#mini .mn.paused{fill:var(--amber)}
#mini .mv{fill:rgba(61,214,245,.1);stroke:var(--cyan);stroke-width:1.2;vector-effect:non-scaling-stroke}
.gbox{fill:rgba(19,38,58,.4);stroke:#22405a;stroke-width:1.4}
.ghead{cursor:pointer}
.ghead .hbg{fill:rgba(30,52,76,.8)}.ghead:hover .hbg{fill:rgba(42,74,104,.9)}
.ghead text{font-family:var(--disp)}
.gname{font-weight:600;font-size:14.5px;fill:var(--text)}
.gstat{font-family:var(--mono)!important;font-size:12px;fill:var(--muted)}
.gchev{font-size:12px;fill:var(--muted)}
.sdot{fill:var(--faint)}
.group.running .sdot{fill:var(--cyan)}.group.running .gbox{stroke:var(--cyan-deep)}
.group.done .sdot{fill:var(--green)}.group.done .gbox{stroke:#2c7f8f}
.group.failed .sdot{fill:var(--coral)}.group.failed .gbox{stroke:var(--coral)}
.group.paused .sdot{fill:var(--amber)}.group.paused .gbox{stroke:var(--amber)}
.pd{fill:var(--faint)}.pd.running{fill:var(--cyan)}.pd.done{fill:var(--green)}.pd.failed{fill:var(--coral)}.pd.waiting{fill:var(--amber)}
.node.cgroup rect.box{fill:#10253a;stroke:#2f5876}
.empty{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-family:var(--mono)}
@media (max-width:900px){main{grid-template-columns:1fr;grid-template-rows:55vh 1fr}aside{border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<div class="app">
  <header>
    <span class="brand">cag<b>·</b>web</span>
    <span id="gname" class="stat"></span>
    <select id="runsel" class="btn" hidden aria-label="run"></select>
    <span id="status" class="pill">idle</span>
    <span class="stat">cost <b id="cost">$0.0000</b></span>
    <span class="stat">elapsed <b id="elapsed">0.0s</b></span>
    <span id="path" class="path"></span>
    <span class="spacer"></span>
    <span id="mode" class="stat"></span>
    <button id="galbtn" class="btn" hidden aria-pressed="true">gallery</button>
    <button id="pausebtn" class="btn warn" hidden>Pause before next</button>
  </header>
  <main>
    <section id="stage" aria-label="graph">
      <div class="toolbar" id="toolbar">
        <span class="seg" role="group" aria-label="layout"><button class="btn" data-l="auto" title="snake when the left-to-right layout would not fit the view">auto</button><button class="btn" data-l="lr" title="left to right">LR</button><button class="btn" data-l="tb" title="top to bottom">TB</button><button class="btn" data-l="snake" title="rows that wrap to the view width">snake</button></span>
        <button class="btn" id="grpbtn" hidden title="group long chains into stages automatically">stages</button>
        <button class="btn" id="collbtn" hidden>collapse all</button>
        <button class="btn" id="afbtn" hidden title="expand the group that holds the running node">auto focus</button>
        <button class="btn" id="camfollow" title="keep the running node in view (turns off when you pan)">follow</button>
        <button class="btn" id="fit" title="fit graph to view (f)">fit</button>
      </div>
      <svg id="svg" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2c4258"/></marker>
          <marker id="arrow-taken" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3a8aa0"/></marker>
          <marker id="arrow-hot" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3DD6F5"/></marker>
        </defs>
        <g id="vp"><g id="lanes"></g><g id="groups"></g><g id="edges"></g><g id="nodes"></g><g id="packets"></g></g>
      </svg>
      <svg id="mini" xmlns="http://www.w3.org/2000/svg" aria-label="minimap" hidden></svg>
      <div id="empty" class="empty">waiting for a run…</div>
      <div id="bpb" class="overlay" hidden></div>
      <div id="ask" class="overlay" hidden></div>
    </section>
    <aside>
      <div class="ph" id="ph"></div>
      <div class="tabs" id="tabs"></div>
      <div id="panel"></div>
    </aside>
  </main>
  <footer>
    <div id="gal" role="region" aria-label="image artifacts" hidden></div>
    <div class="scrub">
      <button id="play" class="btn primary" aria-label="play or pause">play</button>
      <select id="speed" aria-label="speed"><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="2">2x</option><option value="4">4x</option><option value="10">10x</option></select>
      <input id="slider" type="range" min="0" max="0" value="0" aria-label="time scrubber">
      <span id="pos" class="stat"></span>
      <label><input id="follow" type="checkbox" checked> follow live</label>
      <label><input id="showagent" type="checkbox"> agent events</label>
    </div>
    <div id="log" role="log"></div>
  </footer>
</div>
<div id="lb" hidden role="dialog" aria-label="image viewer"></div>
<script>window.GRAPHWEB=/*GRAPHWEB_BOOT*/null;</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dagre/0.8.5/dagre.min.js" onerror="window.__nodagre=1"></script>
<script>
'use strict';
const BOOT = window.GRAPHWEB || {token:'', readOnly:true};
const SVGT = new Set(['svg','g','path','rect','circle','text','line','tspan']);
function el(tag, attrs, ...kids){
  const e = SVGT.has(tag) ? document.createElementNS('http://www.w3.org/2000/svg', tag) : document.createElement(tag);
  for (const k in (attrs||{})) { const v = attrs[k]; if (v==null||v===false) continue;
    if (k==='text') e.textContent = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v===true?'':String(v)); }
  for (const c of kids.flat(2)) { if (c==null||c===false) continue; e.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return e;
}
const $ = id => document.getElementById(id);
const fmtCost = c => '$' + (c||0).toFixed(4);
const fmtDur = ms => ms==null ? '' : ms < 1000 ? ms+'ms' : (ms/1000).toFixed(ms<10000?1:0)+'s';
const clip = (s,n) => { s = String(s==null?'':s); return s.length>n ? s.slice(0,n-1)+'…' : s; };

// ---------------- stream ----------------
let pending = [], flushT = null;
function onMessage(ev){

  flushT=null; const batch=pending; pending=[];

  const latest = S.runs[S.runs.length-1];

// ---------------- layout ----------------
function nodeSize(n){

    g.setDefaultEdgeLabel(()=>({}));

// ---------------- artifacts ----------------
const artURL = a => '/api/artifact/'+a.seq;
const isImg = a => /^image\//.test(a.mime||'');
const isTxt = a => /^text\/|json|xml/.test(a.mime||'') && !/html|svg/.test(a.mime||'');
function artCard(a){
  const body = [];
  if (isImg(a)) body.push(el('img',{src:artURL(a),alt:a.name,loading:'lazy',onclick:()=>openLb(a.seq)}));
  body.push(el('div',{class:'an',text:a.name}));
  if (a.caption) body.push(el('div',{class:'ac',text:a.caption}));
  body.push(el('div',{class:'am'}, 'step '+a.step+' · '+(a.mime||'?')+' · ', el('a',{href:artURL(a),target:'_blank',rel:'noopener',text:'open'})));
  if (isTxt(a)){
    const open = S.open.has(a.seq);
    body.push(el('button',{class:'btn',style:'margin-top:6px',text:open?'hide':'view',onclick:()=>toggleTxt(a)}));
    if (open) body.push(el('pre',{text:S.txt[a.seq]==null?'loading…':S.txt[a.seq]}));
  }
  return el('div',{class:'art'},body);
}
function toggleTxt(a){
  if (S.open.has(a.seq)) S.open.delete(a.seq); else {
    S.open.add(a.seq);
    if (S.txt[a.seq]==null) fetch(artURL(a)).then(r=>r.ok?r.text():Promise.reject(r.status)).then(t=>{
      if (/json/.test(a.mime)) { try { t=JSON.stringify(JSON.parse(t),null,2); } catch(e){} }
      S.txt[a.seq]=t.length>200000?t.slice(0,200000)+'\n…[truncated]':t; panelSig=''; paintPanel(); },
      e=>{ S.txt[a.seq]='(cannot load: '+e+')'; panelSig=''; paintPanel(); });
  }
  panelSig=''; paintPanel();
}
// gallery: newest version per node+name, in emit order of that version
function galleryItems(m){
  const by=new Map();
  for (const a of m.arts) if (isImg(a)) { const k=a.node+'|'+a.name; by.delete(k); by.set(k,a); }
  return [...by.values()];
}
function paintGallery(){
  const m=S.m, gal=$('gal'), btn=$('galbtn'); if (!m) return;
  const items=galleryItems(m);
  btn.hidden = !items.length; btn.textContent='gallery ('+items.length+')'; btn.setAttribute('aria-pressed',S.gal);
  btn.className='btn'+(S.gal?' primary':'');
  gal.hidden = !items.length || !S.gal;
  if (gal.hidden) { gal.dataset.sig=''; return; }
  const sel=S.sel&&S.sel.node;
  const sig=S.curRun+':'+items.map(a=>a.seq).join(',')+':'+sel;
  if (gal.dataset.sig===sig) return; gal.dataset.sig=sig;
  const stick = gal.scrollLeft+gal.clientWidth>=gal.scrollWidth-40;
  gal.replaceChildren(...items.map(a=>el('div',{class:'gi'+(sel===a.node?' sel':''),title:a.node+' · '+a.name+(a.caption?' — '+a.caption:''),
      onclick:()=>{ S.sel={node:a.node,step:null}; S.selAuto=false; S.tab='artifacts'; paint(); }},
    el('img',{src:artURL(a),alt:a.name,loading:'lazy'}),
    el('button',{class:'btn zoom',text:'⤢','aria-label':'enlarge',onclick:e=>{e.stopPropagation();openLb(a.seq);}}),
    el('div',{class:'gl'},el('b',{text:a.node+' · '+a.name}),a.caption||''))));
  if (stick) gal.scrollLeft=gal.scrollWidth;
}
$('galbtn').onclick=()=>{ S.gal=!S.gal; paintGallery(); };
// lightbox: arrows step through every image of the run (all versions), or through a custom list (review items)
function lbList(){ return S.lbCustom || (S.m ? S.m.arts.filter(isImg).map(a=>({key:a.seq,url:artURL(a),title:a.node+' · '+a.name,caption:a.caption})) : []); }
function openLb(key,custom){ S.lbCustom=custom||null; S.lb=key; paintLb(); }
function closeLb(){ S.lb=null; S.lbCustom=null; paintLb(); }
function stepLb(d){ const l=lbList(); if(!l.length) return; const i=l.findIndex(a=>a.key===S.lb); S.lb=l[(i+d+l.length)%l.length].key; paintLb(); }
function paintLb(){
  const lb=$('lb'); const l=lbList(); const i=l.findIndex(a=>a.key===S.lb);
  if (S.lb==null || i<0){ lb.hidden=true; lb.replaceChildren(); S.lb=null; return; }
  const a=l[i]; lb.hidden=false;
  lb.replaceChildren(el('button',{class:'btn x',text:'✕ esc','aria-label':'close',onclick:e=>{e.stopPropagation();closeLb();}}),
    l.length>1?el('button',{class:'btn nav l',text:'‹','aria-label':'previous',onclick:e=>{e.stopPropagation();stepLb(-1);}}):null,
    el('img',{src:a.url,alt:a.title,onclick:e=>e.stopPropagation()}),
    l.length>1?el('button',{class:'btn nav r',text:'›','aria-label':'next',onclick:e=>{e.stopPropagation();stepLb(1);}}):null,
    el('div',{class:'lc',onclick:e=>e.stopPropagation()},a.title+' ',el('span',{text:(i+1)+' / '+l.length}),a.caption?el('div',{class:'muted',text:a.caption}):null));
}
$('lb').addEventListener('click',closeLb);
document.addEventListener('keydown',e=>{ if (S.lb==null) return;
  if (e.key==='Escape') closeLb(); else if (e.key==='ArrowLeft') stepLb(-1); else if (e.key==='ArrowRight') stepLb(1); else return; e.preventDefault(); });

// ---------------- log ----------------
function describe(e){
  switch(e.type){
  case 'graph_start': return e.topology?e.topology.name:'';
  case 'node_start': return `${e.node} #${e.step}${e.attempt>1?' try '+e.attempt:''}${e.parent?' (branch of '+e.parent+')':''}`;
  case 'node_end': { const ks=e.diff?Object.keys(e.diff):[]; return `${e.node} #${e.step} ${fmtDur(e.duration_ms)}${e.cost_usd?' '+fmtCost(e.cost_usd):''}${e.paused?' paused':''}${e.err?' ERR '+clip(e.err,80):''}${ks.length?'  Δ '+ks.join(','):''}`; }
  case 'edge': return `${e.from} → ${e.to}${e.back?'  ↺':''}${e.iter>1?'  ×'+e.iter:''}`;
  case 'agent_event': { const st=e.stream||{}; if (st.type==='assistant'){ const b=blocksOf(st)[0]||{}; return `${e.node}: ${b.type==='tool_use'?'🔧 '+(b.name||'').replace(/^mcp__[^_]+__/,''):clip((b.text||b.type||'').replace(/\s+/g,' '),120)}`; }
    if (st.type==='user') { const b=blocksOf(st)[0]||{}; return `${e.node}: ↳ ${clip(toolResultText(b.content).replace(/\s+/g,' '),120)}`; }
    if (st.type==='result') return `${e.node}: result ${fmtCost(st.total_cost_usd||st.cost_usd)}`; return `${e.node}: ${st.type}${st.subtype?'/'+st.subtype:''}`; }
  case 'agent_input': return `${e.node}: input · ${(e.input&&e.input.input&&e.input.input.model)||''} · prompt ${((e.input&&e.input.input&&e.input.input.prompt)||'').length} chars`;
  case 'artifact': { const a=e.artifact||{}; return `${e.node}: 🖼 ${a.name||''}${a.caption?' · '+clip(a.caption,80):''}  ${a.mime||''}`; }
  case 'interrupt': return `${e.node}: ${e.items&&e.items.length?'['+e.items.length+' items to review] ':''}${clip((e.question||'').replace(/\s+/g,' '),140)}`;
  case 'resume': return `${e.node}: ${clip(e.answer,100)}`;
  case 'breakpoint_hit': return `before ${e.node} #${e.step}`;
  case 'graph_end': return `${e.status} ${fmtCost(e.total_cost_usd)} ${fmtDur(e.duration_ms)}${e.err?' '+clip(e.err,100):''}`;
  }
  return '';
}
function paintLog(){
  const log=$('log'); const m=S.m; const t0=m&&m.t0;
  const rows=[]; let idx=[];
  for (let i=0;i<S.cursor;i++){ const e=S.events[i]; if (e.run!==S.curRun) continue; if (e.type==='agent_event' && !S.showAgent) continue; idx.push(i); }
  idx = idx.slice(-400);
  const sig=idx.length+':'+(idx.length?idx[idx.length-1]:'')+':'+S.showAgent+':'+(S.sel&&S.sel.node)+':'+(S.sel&&S.sel.step);
  if (log.dataset.sig===sig) return; log.dataset.sig=sig;
  const stick = log.scrollTop+log.clientHeight>=log.scrollHeight-30;
  log.replaceChildren(...idx.map(i=>{ const e=S.events[i];
    const tcls = e.type==='graph_end'?e.status:'';
    return el('div',{class:'row'+(S.sel&&S.sel.node===e.node&&(!S.sel.step||S.sel.step===e.step)?' sel':''),
      onclick:()=>{ if(e.node){ S.sel={node:e.node,step:e.step||null}; S.selAuto=false; paint(); } },
      ondblclick:()=>seekTo(i+1)},
      el('span',{class:'n',text:e.seq}), el('span',{class:'t',text:t0?((Date.parse(e.ts)-t0)/1000).toFixed(1)+'s':''}),
      el('span',{class:'ty '+e.type+' '+tcls,text:e.type}), el('span',{class:'d',text:describe(e)})); }));
  if (stick || S.follow) log.scrollTop=log.scrollHeight;
}
$('showagent').onchange=e=>{ S.showAgent=e.target.checked; $('log').dataset.sig=''; paintLog(); };

// ---------------- scrubber / playback ----------------
function paintScrub(){
  const sl=$('slider'); sl.max=S.events.length; sl.value=S.cursor;
  $('pos').textContent = S.cursor+' / '+S.events.length;
  $('play').textContent = S.playing ? 'pause' : 'play';
}
function seekTo(c){
  S.seeked=true; stopPlay(); S.cursor=Math.max(0,Math.min(S.events.length,c));
  S.follow = false; $('follow').checked=false;
  rebuild(); clearPackets(); panelSig=''; paint();
}
$('slider').addEventListener('input',e=>seekTo(+e.target.value));
$('follow').onchange=e=>{ S.follow=e.target.checked; if (S.follow){ stopPlay(); S.cursor=S.events.length; rebuild(); panelSig=''; paint(); } };
$('speed').onchange=e=>{ S.speed=+e.target.value; };
$('play').onclick=()=>{ S.playing ? stopPlay() : startPlay(); paintScrub(); };
let playT=null;
function stopPlay(){ S.playing=false; clearTimeout(playT); }
function startPlay(){
  if (S.cursor>=S.events.length){ S.cursor=0; rebuild(); panelSig=''; }
  S.seeked=true; S.follow=false; $('follow').checked=false; S.playing=true; step();
  function step(){
    if (!S.playing) return;
    if (S.cursor>=S.events.length){ S.playing=false; if (S.live){ S.follow=true; $('follow').checked=true; } paint(); return; }
    const e=S.events[S.cursor]; const prev=S.events[S.cursor-1];
    const fx=[]; if (e.run===S.curRun) apply(S.m,e,fx); S.cursor++;
    playFx(fx); paint();
    const nx=S.events[S.cursor]; let d=15;
    if (nx){ const gap=Date.parse(nx.ts)-Date.parse(e.ts); d=Math.max(12,Math.min(gap,900))/S.speed; }
    playT=setTimeout(step,d);
  }
}

// ---------------- packets ----------------
function clearPackets(){ $('packets').replaceChildren(); }
function playFx(fx){
  if (!S.layout || document.hidden) return;
  for (const f of fx){
    const x=S.layout.edgeEls[f.edge]; if (!x||!x.len) continue;
    S.lastEdgeWall=Date.now();
    const w=f.chip.length*6.3+14;
    const g=el('g',{class:'packet'}, el('rect',{x:-w/2,y:-30,width:w,height:17,rx:8}), el('text',{x:0,y:-18,'text-anchor':'middle',text:f.chip}), el('circle',{r:5}));
    $('packets').append(g);
    const dur=Math.max(260, 750/Math.max(1,S.speed)), t0=performance.now();
    (function tick(now){
      const t=Math.min(1,(now-t0)/dur); const p=x.p.getPointAtLength(x.len*(t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2));
      g.setAttribute('transform',`translate(${p.x},${p.y})`);
      if (t<1) requestAnimationFrame(tick); else g.remove();
    })(t0);
    setTimeout(()=>{ if (S.m) paint(); }, 1250);
  }
}

// ---------------- controls ----------------
function postJSON(url,body){ return fetch(url,{method:'POST',headers:{'Content-Type':'application/json','X-Graphweb-Token':BOOT.token},body:JSON.stringify(body)}); }
function control(a){ postJSON('/api/control',{action:a}); }
function toggleBp(id){ if (S.bps.has(id)) S.bps.delete(id); else S.bps.add(id); paint(); postJSON('/api/breakpoints',{nodes:[...S.bps]}).then(r=>r.json()).then(j=>{ S.bps=new Set(j.nodes); paint(); }); }
$('pausebtn').onclick=()=>control('pause');
$('runsel').onchange=e=>{ S.curRun=e.target.value; S.follow=false; $('follow').checked=false; S.cursor=S.events.length; S.sel=null; S.selAuto=true; rebuild(); panelSig=''; paint(); };
const _paint=paint; paint=function(){ _paint();
  const rs=$('runsel'); if (S.runs.length>1){ rs.hidden=false; if (rs.options.length!==S.runs.length){ rs.replaceChildren(...S.runs.map((r,i)=>el('option',{value:r,text:'run '+(i+1)+' · '+r.slice(4,10)}))); } rs.value=S.curRun; } };

// ---------------- boot ----------------
if (!BOOT.readOnly) fetch('/api/breakpoints').then(r=>r.json()).then(j=>{ S.bps=new Set(j.nodes||[]); paint(); }).catch(()=>{});
$('mode').textContent = BOOT.readOnly ? 'replay (read-only)' : 'live';
connect();
</script>
