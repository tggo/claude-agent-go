<!doctype html>
<html lang="en" data-theme="auto" data-embed="0">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>graph web</title>
<!--GRAPHWEB_THEME-->
<style>
/* Role tokens (--bg, --surface, --raised, --line, --text, --muted, --faint, --accent, --ok, --warn, --bad,
   --info, --ui, --mono) are injected by the server from the light/dark defaults and the host's WithTheme.
   The tokens below are derived from them, so a host only has to set the roles. */
:root{
  --accent-strong:color-mix(in srgb,var(--accent) 72%,var(--bg));
  --accent-dim:color-mix(in srgb,var(--accent) 55%,var(--bg));
  --edge:color-mix(in srgb,var(--muted) 32%,var(--bg));
  --edge-taken:color-mix(in srgb,var(--accent) 55%,var(--bg));
  --bar:color-mix(in srgb,var(--accent) 62%,var(--bg));
  --model:color-mix(in srgb,var(--info) 55%,var(--bad));
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--ui);font-size:14px;overflow:hidden}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-rows:auto auto 1fr auto;grid-template-columns:minmax(0,1fr);height:100%}
header{display:flex;align-items:center;gap:18px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.brand{font-family:var(--mono);font-weight:600;letter-spacing:-.02em}
.brand b{color:var(--accent)}
.pill{font-family:var(--mono);font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.pill.running{color:var(--accent);border-color:var(--accent)}
.pill.waiting,.pill.paused{color:var(--warn);border-color:var(--warn)}
.pill.done{color:var(--ok);border-color:var(--ok)}
.pill.failed,.pill.error,.pill.cancelled,.pill.max_steps{color:var(--bad);border-color:var(--bad)}
.stat{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.stat b{color:var(--text);font-weight:500}
.path{font-family:var(--mono);font-size:12px;color:var(--muted);max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.path i{font-style:normal;color:var(--faint)}
.spacer{flex:1}
.btn{background:var(--raised);border:1px solid var(--line);border-radius:7px;padding:4px 12px;cursor:pointer;font-family:var(--mono);font-size:12.5px}
.btn:hover{border-color:var(--accent)}
.btn.primary{border-color:var(--accent-strong);color:var(--accent)}
.btn.warn{border-color:var(--warn);color:var(--warn)}
.btn:disabled{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{display:grid;grid-template-columns:minmax(0,1fr) 440px;min-height:0}
#stage{position:relative;min-width:0;min-height:0;background:radial-gradient(circle at 1px 1px,var(--line) 1px,transparent 0) 0 0/24px 24px}
#svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#svg.panning{cursor:grabbing}
aside{border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.ph{padding:12px 14px 6px;border-bottom:1px solid var(--line)}
.ph h2{margin:0;font-size:16px;font-weight:600}
.ph .sub{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.tabs{display:flex;gap:2px;padding:6px 10px 0;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.tab{white-space:nowrap;padding:6px 9px;border:0;background:none;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;font-family:var(--mono);font-size:12.5px}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
#panel{overflow:auto;padding:12px 14px;flex:1;min-height:0}
.muted{color:var(--muted)}
.ev{border-left:2px solid var(--line);padding:2px 0 2px 10px;margin:0 0 10px}
.ev .k{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.ev.text{border-color:var(--accent)} .ev.tool_use{border-color:var(--warn)} .ev.tool_result{border-color:var(--faint)}
.ev.err{border-color:var(--bad)} .ev.result{border-color:var(--ok)} .ev.marker{border-color:var(--warn)}
.ev pre,.val{margin:4px 0 0;white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:12px;line-height:1.5}
.ev .tool{font-family:var(--mono);color:var(--warn);font-size:12.5px}
.tlg{display:flex;align-items:center;gap:8px;margin:12px 0 4px;font-family:var(--mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tlg .pill{font-size:10.5px;padding:1px 7px}
.tl{border-bottom:1px solid var(--line);padding:5px 0}
.tl>summary,.tl.unused{display:flex;align-items:baseline;gap:10px;font-family:var(--mono);font-size:12.5px;list-style:none}
.tl>summary::-webkit-details-marker{display:none}
.tl>summary::before{content:'▸';color:var(--faint)} .tl[open]>summary::before{content:'▾'}
.tl.bad>summary{border-left:2px solid var(--bad);padding-left:6px}
.tl>summary:focus-visible{outline:1px solid var(--accent);outline-offset:2px}
.tallow{font-family:var(--mono);font-size:12px;margin:6px 0 0 18px;color:var(--muted)}
.tallow.no{color:var(--warn)} .tallow.yes{color:var(--ok)}
.tl-unused>summary{color:var(--muted)}
.tug{margin:0 0 6px 18px}
.tchips{display:flex;flex-wrap:wrap;gap:4px}
.tchip{font-family:var(--mono);font-size:11.5px;padding:1px 7px;border:1px solid var(--line);border-radius:6px;color:var(--muted);overflow-wrap:anywhere}
.tchip.off{border-style:dashed}
.tmode{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tl .ev{margin:8px 0 8px 18px}
.tn{overflow-wrap:anywhere;min-width:0}
.tc{margin-left:auto;color:var(--muted);white-space:nowrap}
.tc.bad{color:var(--bad)}
.rt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:6px 0;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12.5px}
.rt .rn{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px}
.rt .rn .btn{padding:1px 8px;font-size:11.5px}
.pill.bs{cursor:pointer;background:none}
.pill.bs:hover{border-color:var(--accent)}
.bshead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pill.bs[aria-pressed="true"]{background:var(--raised)}
.bsacts{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.bsq{border:1px solid var(--warn);border-radius:10px;padding:10px 12px;margin:0 0 14px}
.ev[class*="bs-"] .k{color:var(--muted)}
#bshead:focus{outline:none}
.bsq .bsk{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--warn)}
.bsq .q{margin:4px 0 8px;white-space:pre-wrap;word-break:break-word}
.bsq .row2{display:flex;gap:8px}
.bsq input{flex:1;min-width:0;background:var(--raised);border:1px solid var(--line);border-radius:7px;padding:6px 10px}
.bserr{color:var(--bad);font-family:var(--mono);font-size:12px;margin:0 0 10px;word-break:break-word}
.ev.bs-woke,.ev.bs-continue_requested{border-color:var(--accent)} .ev.bs-doing{border-color:var(--warn)}
.ev.bs-asked,.ev.bs-handover,.ev.bs-takeover,.ev.bs-pause_requested{border-color:var(--warn)} .ev.bs-answered{border-color:var(--ok)}
details>summary{cursor:pointer;color:var(--muted);font-family:var(--mono);font-size:12px}
.kv{margin:0 0 14px}
.kv .key{font-family:var(--mono);font-size:12px;color:var(--accent);margin-bottom:2px}
.kv .val{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;max-height:260px;overflow:auto}
.kv .val.before{border-color:color-mix(in srgb,var(--bad) 40%,var(--bg));background:color-mix(in srgb,var(--bad) 10%,var(--bg))} .kv .val.after{border-color:color-mix(in srgb,var(--accent) 40%,var(--bg));background:color-mix(in srgb,var(--accent) 9%,var(--bg))}
.kv .tag{font-family:var(--mono);font-size:10.5px;color:var(--faint);text-transform:uppercase;margin:6px 0 2px}
.steps{display:flex;flex-direction:column;gap:6px}
.step{display:flex;gap:10px;align-items:center;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);cursor:pointer;font-family:var(--mono);font-size:12.5px}
.step.on{border-color:var(--accent)} .step:hover{border-color:var(--accent-strong)}
.step .st{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.step .st.done{background:var(--ok)} .step .st.running{background:var(--accent)} .step .st.failed{background:var(--bad)} .step .st.waiting{background:var(--warn)}
/* bottom */
footer{border-top:1px solid var(--line);background:var(--surface)}
.scrub{display:flex;align-items:center;gap:12px;padding:8px 16px}
.scrub input[type=range]{flex:1;accent-color:var(--accent)}
.scrub label{font-family:var(--mono);font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.scrub select{background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
#log[hidden]{display:none}
#log{height:var(--log-h,170px);overflow:auto;font-family:var(--mono);font-size:12px;border-top:1px solid var(--line)}
.row{display:flex;gap:10px;padding:2px 16px;cursor:pointer;white-space:nowrap;align-items:baseline}
.row:hover{background:var(--raised)} .row.sel{background:color-mix(in srgb,var(--accent) 14%,var(--bg))}
.row .n{width:46px;color:var(--faint);text-align:right;flex:none}
.row .t{width:58px;color:var(--faint);flex:none}
.row .ty{width:110px;flex:none;color:var(--muted)}
.row .ty.artifact{color:var(--ok)} .row .ty.node_start,.row .ty.node_end{color:var(--accent)} .row .ty.edge{color:var(--muted)} .row .ty.interrupt,.row .ty.breakpoint_hit,.row .ty.resume{color:var(--warn)}
.row .ty.graph_end.ok{color:var(--ok)} .row .ty.err{color:var(--bad)}
.row .d{overflow:hidden;text-overflow:ellipsis}
/* artifacts */
#gal{border-top:1px solid var(--line);padding:6px 16px 8px;overflow-x:auto;white-space:nowrap}
#gal .gi{display:inline-block;vertical-align:top;width:112px;margin-right:10px;cursor:pointer;white-space:normal;border:1px solid var(--line);border-radius:8px;background:var(--bg);overflow:hidden;position:relative}
#gal .gi:hover,#gal .gi.sel{border-color:var(--accent)}
#gal .gi img{display:block;width:100%;height:78px;object-fit:cover;background:var(--raised)}
#gal .gi .gl{padding:3px 6px 4px;font-family:var(--mono);font-size:10.5px;line-height:1.35;color:var(--muted);overflow:hidden;max-height:4.1em}
#gal .gi .gl b{color:var(--text);font-weight:500;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#gal .gi .zoom{position:absolute;top:3px;right:3px;padding:0 6px;font-size:12px;line-height:18px;background:color-mix(in srgb,var(--bg) 80%,transparent)}
.node .prog{fill:var(--accent)}
.art{margin:0 0 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px}
.art img{display:block;max-width:100%;max-height:300px;margin:0 auto 6px;cursor:zoom-in;border-radius:4px;background:var(--raised)}
.art .an{font-family:var(--mono);font-size:12px;color:var(--accent)}
.art .abar{display:flex;gap:6px;margin-top:6px}
.art .md{margin-top:8px;font:13px/1.5 system-ui,sans-serif;color:var(--text);max-height:70vh;overflow:auto;padding-right:4px}
.art .md h2,.art .md h3,.art .md h4,.art .md h5{margin:12px 0 6px;line-height:1.25}.art .md h2{font-size:17px}.art .md h3{font-size:15px}.art .md h4,.art .md h5{font-size:13px}
.art .md p{margin:6px 0}.art .md ul,.art .md ol{margin:4px 0 8px;padding-left:20px}.art .md li.sub{margin-left:14px}
.art .md blockquote{margin:4px 0;padding:2px 10px;border-left:3px solid var(--line);color:var(--muted)}
.art .md code{font-family:var(--mono);font-size:12px;background:var(--raised);padding:0 4px;border-radius:3px}
.art .md table{border-collapse:collapse;margin:6px 0;font-size:12px}.art .md th,.art .md td{border:1px solid var(--line);padding:3px 6px;vertical-align:top}
.art .md a{color:var(--accent)}.art .md hr{border:0;border-top:1px solid var(--line)}
.art .ac{font-size:12.5px;color:var(--muted);margin-top:2px}
.art .am{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:2px}
.art a{color:var(--accent);font-family:var(--mono);font-size:12px}
.art pre{margin:6px 0 0;max-height:300px;overflow:auto;white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
#lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px}
#lb img{max-width:94vw;max-height:80vh;object-fit:contain;border-radius:6px;box-shadow:0 10px 50px rgba(0,0,0,.6)}
#lb .lc{font-family:var(--mono);font-size:13px;color:var(--text);text-align:center;max-width:80vw}
#lb .lc span{color:var(--muted)}
#lb .nav{position:absolute;top:50%;transform:translateY(-50%);font-size:22px;padding:8px 14px}
#lb .nav.l{left:16px} #lb .nav.r{right:16px} #lb .x{position:absolute;top:14px;right:16px}
#ask.review{position:fixed;inset:10px;left:10px;bottom:10px;transform:none;max-width:none;width:auto;z-index:40;display:flex;flex-direction:column;gap:10px;border-color:var(--accent-strong)}
#ask.review .q{margin:0}
.rgrid{overflow:auto;flex:1;min-height:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:12px;align-content:start}
.rc{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:8px;display:flex;flex-direction:column;gap:6px}
.rc img{display:block;width:100%;height:auto;border-radius:6px;background:var(--raised);cursor:zoom-in}
.rc .rn{font-family:var(--mono);font-size:12.5px;color:var(--accent)}
.rc .ac{font-size:12.5px;color:var(--muted);white-space:pre-line}
#ask textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:6px 10px;resize:vertical;font-family:var(--ui)}
#ask textarea:focus-visible{border-color:var(--accent)}
.rfoot{display:flex;flex-direction:column;gap:8px}
.rfoot .row2{display:flex;gap:8px;justify-content:flex-end}
.rthumbs{display:flex;gap:8px;overflow-x:auto;margin:0 0 8px}
.rthumbs img{height:64px;border-radius:5px;cursor:zoom-in}
/* run metrics strip */
.metrics{display:flex;gap:0;border-bottom:1px solid var(--line);background:var(--bg);padding:0 8px;overflow-x:auto}
.metrics .mc{padding:7px 18px 8px 8px;min-width:96px}
.metrics .ml{font-size:11.5px;color:var(--muted)}
.metrics .mv{font-family:var(--mono);font-size:15px;font-variant-numeric:tabular-nums;color:var(--text);margin-top:1px}
.metrics .mv.bad{color:var(--bad)}
.metrics .ag{margin-left:auto;align-self:center;font-family:var(--mono);font-size:12.5px;color:var(--muted);white-space:nowrap;padding:0 8px}
.metrics .ag b{color:var(--accent);font-weight:500}
/* node cards (HTML inside foreignObject) */
.card{width:100%;height:100%;padding:9px 11px 0;display:flex;flex-direction:column;overflow:hidden;font-family:var(--ui);color:var(--text);user-select:none}
.card .ch{display:flex;align-items:flex-start;gap:8px;min-height:30px}
.card .ci{flex:none;width:24px;height:24px;border-radius:6px;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--muted);background:var(--bg)}
.node.agent .card .ci{color:var(--bad)}
.card .cn{flex:1;min-width:0;line-height:1.2}
.card .cn b{display:block;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .cn small{display:block;font-family:var(--mono);font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spill{flex:none;font-size:11.5px;padding:2px 8px;border-radius:6px;background:var(--raised);color:var(--muted);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.spill.running{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--accent)}
.spill.running i{width:7px;height:7px;border-radius:50%;background:currentColor;animation:blink 1s ease-in-out infinite}
.spill.done{background:color-mix(in srgb,var(--ok) 12%,transparent);color:var(--ok)}
.spill.failed{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.spill.waiting,.spill.paused{background:color-mix(in srgb,var(--warn) 13%,transparent);color:var(--warn)}
.card .ct{font-size:12.5px;color:var(--text);margin:3px 0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;height:18px}
.card .rows{margin:4px -6px 0;display:flex;flex-direction:column}
.srow{display:grid;grid-template-columns:16px minmax(0,1fr) 78px 42px;align-items:center;gap:7px;height:24px;padding:0 6px;border-radius:6px;cursor:pointer;font-size:12.5px}
.srow:hover,.srow.open{background:var(--raised)}
.srow .si{font-size:11px;text-align:center;color:var(--muted)}
.srow .si.model{color:var(--model)}.srow .si.web{color:var(--info)}.srow .si.edit{color:var(--warn)}.srow .si.shell{color:var(--ok)}.srow .si.mcp{color:var(--accent)}.srow .si.agent{color:var(--bad)}
.srow .sn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .sn em{font-style:normal;color:var(--muted);font-family:var(--mono);font-size:11.5px}
.srow .sg{display:flex;height:7px;border-radius:4px;background:color-mix(in srgb,var(--muted) 14%,transparent);overflow:hidden}
.srow .sg span{display:block;height:100%;flex:none;border-radius:4px;min-width:3px;background:var(--bar)}
.srow .sg span.model{background:var(--model)}.srow .sg span.err{background:var(--bad)}
.srow .sg span.live{background:linear-gradient(90deg,var(--bar),var(--accent),var(--bar));background-size:200% 100%;animation:shimmer 1.2s linear infinite}
.srow .sd{font-family:var(--mono);font-size:11.5px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.srow .sd.err{color:var(--bad)}
.sx{margin:1px 0 3px;padding:6px 9px;border-radius:7px;background:var(--bg);border:1px solid var(--line);height:76px;overflow:hidden;font-family:var(--mono);font-size:11.5px;line-height:1.45}
.sx .sxh{display:flex;justify-content:space-between;color:var(--muted)}
.sx .sxr{color:var(--text);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all;margin-top:2px}
.sx .sxr.err{color:var(--bad)}
.sx .sxi{color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.sx .sxi b{color:var(--muted);font-weight:400;font-family:var(--ui)}
.smore{font-size:12px;color:var(--muted);padding:2px 6px;height:20px;cursor:pointer}
.smore:hover{color:var(--accent)}
.card .cf{margin-top:auto;height:28px;display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden}
.card .cf b{color:var(--text);font-weight:500}
.card .cf .sp{flex:1}
.card .cf .pb{width:70px;height:4px;border-radius:2px;background:color-mix(in srgb,var(--muted) 16%,transparent);overflow:hidden}
.card .cf .pb span{display:block;height:100%;background:var(--accent)}
.edge .port{fill:var(--bg);stroke:var(--edge-taken);stroke-width:1.4}
.edge.watch path{stroke:var(--edge-taken);stroke-dasharray:4 4;marker-end:none}
.edge.watch .port{stroke:var(--edge-taken)}
@keyframes blink{50%{opacity:.25}}
@keyframes shimmer{from{background-position:200% 0}to{background-position:0 0}}
@media (prefers-reduced-motion:reduce){.spill.running i,.srow .sg span.live{animation:none}}
/* svg */
.node rect.box{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.node.agent rect.box{fill:color-mix(in srgb,var(--accent) 7%,var(--surface));stroke:color-mix(in srgb,var(--accent) 38%,var(--line))}
.node .accent{fill:var(--accent-strong);opacity:.0}
.node.agent .accent{opacity:.9}
.node text{fill:var(--text);font-family:var(--ui)}
.node text.name{font-weight:600;font-size:14.5px}
.node text.meta{font-family:var(--mono);font-size:12px;fill:var(--muted)}
.node.idle{opacity:.72}

<script src="https://cdnjs.cloudflare.com/ajax/libs/dagre/0.8.5/dagre.min.js" onerror="window.__nodagre=1"></script>
<script>
'use strict';
const BOOT = window.GRAPHWEB || {token:'', readOnly:true};
if (BOOT.readOnly) document.getElementById('empty').textContent = 'the run has not started yet';
// Every URL the page requests goes through API(): relative to the page by default, so it works under any
// mount that ends in a slash, or under BOOT.base (WithBasePath) when the host set one.
const API = p => (BOOT.base||'')+'api/'+p;
// ?theme=light|dark and ?embed=1 override the server's choice, for a host that frames the page.
(function(){ const q=new URLSearchParams(location.search), h=document.documentElement;
  if (['light','dark','auto'].includes(q.get('theme'))) h.dataset.theme=q.get('theme');
  if (q.get('embed')==='1') h.dataset.embed='1'; })();
const SVGT = new Set(['svg','g','path','rect','circle','text','line','tspan','foreignObject']);
function el(tag, attrs, ...kids){
  const e = SVGT.has(tag) ? document.createElementNS('http://www.w3.org/2000/svg', tag) : document.createElement(tag);
  for (const k in (attrs||{})) { const v = attrs[k]; if (v==null||v===false) continue;
    if (k==='text') e.textContent = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v===true?'':String(v)); }
  for (const c of kids.flat(2)) { if (c==null||c===false) continue; e.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return e;
}
const $ = id => document.getElementById(id);
const fmtCost = c => '$' + (c||0).toFixed(4);
const fmtDur = ms => ms==null ? '' : ms < 1000 ? ms+'ms' : (ms/1000).toFixed(ms<10000?1:0)+'s';
const clip = (s,n) => { s = String(s==null?'':s); return s.length>n ? s.slice(0,n-1)+'…' : s; };
const ekey = (f,t) => f+'|'+t;
const nk = (n,s) => n+'#'+s;

// ---------------- state ----------------
const S = { events:[], cursor:0, follow:true, playing:false, speed:1, runs:[], topo:{}, curRun:null,
  sel:null, selAuto:true, tab:'timeline', bps:new Set(), drawn:null, m:null, initial:true,
  showAgent:false, xp:new Set(), more:new Set(), draft:{}, lbCustom:null, gal:true, lb:null, open:new Set(), txt:{}, aview:{}, lastSeq:0, view:{x:0,y:0,k:1}, layout:null };

// ---------------- model (fold) ----------------
function newModel(run){
  return { run, topo:S.topo[run]||null, nodes:{}, edges:{}, agents:{}, inputs:{}, diffs:{}, arts:[], answers:{}, pending:null, paused:null, bs:null,
    status: S.topo[run] ? 'idle' : 'idle', cost:0, t0:null, tEnd:null, tLast:null, path:[], lastEdge:null, initial:null, end:null, nsteps:0 };
}
function nodeOf(m,id){ return m.nodes[id] || (m.nodes[id]={id, visits:[], status:'idle', cost:0}); }
function visitOf(n,step){ return n.visits.find(v=>v.step===step); }
function apply(m, ev, fx){
  const ts = Date.parse(ev.ts);
  if (m.t0==null && ev.type==='graph_start') m.t0 = ts;
  m.tLast = ts;
  switch (ev.type){
  case 'graph_start':
    m.status='running'; m.initial=ev.state||null; m.t0=ts; break;
  case 'node_start': {
    const n = nodeOf(m,ev.node); let v = visitOf(n,ev.step);
    if (v){ v.status='running'; v.attempt=ev.attempt; v.resumed=true; }
    else { v = {step:ev.step, attempt:ev.attempt, parent:ev.parent, status:'running', startSeq:ev.seq, startTs:ts, cost:0}; n.visits.push(v); }
    n.status='running';
    if (m.paused && m.paused.node===ev.node && m.paused.step===ev.step) m.paused=null;
    if (!ev.parent) m.path.push(ev.node);
    break; }
  case 'node_end': {
    const n = nodeOf(m,ev.node); let v = visitOf(n,ev.step);
    if (!v){ v={step:ev.step,attempt:ev.attempt,parent:ev.parent,status:'running',startSeq:ev.seq,startTs:ts,cost:0}; n.visits.push(v); }
    v.endSeq=ev.seq; v.endTs=ts; v.dur=ev.duration_ms; v.cost+=ev.cost_usd||0; v.err=ev.err; v.state=ev.state; v.diff=ev.diff; v.paused=!!ev.paused;
    v.status = ev.err ? 'failed' : ev.paused ? 'waiting' : 'done';
    n.cost += ev.cost_usd||0; m.cost += ev.cost_usd||0;
    n.status = n.visits.some(x=>x.status==='running') ? 'running' : v.status;
    m.diffs[nk(ev.node,ev.step)] = ev.diff||{};
    break; }
  case 'edge': {
    const k = ekey(ev.from,ev.to); const e = m.edges[k] || (m.edges[k]={n:0});
    e.n = ev.iter || e.n+1; e.last = ev.seq; m.lastEdge = {key:k, seq:ev.seq};
    if (fx) { let chip;
      if (ev.from==='__start__') chip = m.initial ? 'input: '+Object.keys(m.initial).slice(0,3).join(', ') : 'input';
      else if (m.topo && (m.topo.nodes.find(x=>x.id===ev.from)||{}).kind==='parallel' && ev.to!=='__end__' && (m.topo.nodes.find(x=>x.id===ev.to)||{}).parent===ev.from) chip='fork';
      else { const d = m.diffs[nk(ev.from,ev.step)]; const ks = d?Object.keys(d):[]; chip = ks.length ? 'Δ '+ks.slice(0,3).join(', ')+(ks.length>3?' +'+(ks.length-3):'') : 'no change'; }
      fx.push({edge:k, chip, back:ev.back}); }
    break; }
  case 'agent_event': {
    const k = nk(ev.node,ev.step); (m.agents[k]||(m.agents[k]=[])).push(ev); break; }
  case 'agent_input': {
    const k = nk(ev.node,ev.step); (m.inputs[k]||(m.inputs[k]=[])).push(ev.input); break; }
  case 'progress':
    if (ev.progress && !ev.parent) { const n=nodeOf(m,ev.node), v=visitOf(n,ev.step); if (v) v.prog=ev.progress; n.prog=ev.progress; } break;
  case 'artifact':
    if (ev.artifact) m.arts.push(Object.assign({seq:ev.seq,node:ev.node,step:ev.step,parent:ev.parent}, ev.artifact)); break;

  case 'node_end': { const ks=e.diff?Object.keys(e.diff):[]; return `${e.node} #${e.step} ${fmtDur(e.duration_ms)}${e.cost_usd?' '+fmtCost(e.cost_usd):''}${e.paused?' paused':''}${e.err?' ERR '+clip(e.err,80):''}${ks.length?'  Δ '+ks.join(','):''}`; }
  case 'edge': return `${e.from} → ${e.to}${e.back?'  ↺':''}${e.iter>1?'  ×'+e.iter:''}`;
  case 'agent_event': { const st=e.stream||{}; if (st.type==='assistant'){ const b=blocksOf(st)[0]||{}; return `${e.node}: ${b.type==='tool_use'?'🔧 '+(b.name||'').replace(/^mcp__[^_]+__/,''):clip((b.text||b.type||'').replace(/\s+/g,' '),120)}`; }

    playFx(fx); paint();
    const nx=S.events[S.cursor]; let d=15;
    if (nx){ const gap=Date.parse(nx.ts)-Date.parse(e.ts); d=Math.max(12,Math.min(gap,900))/S.speed; }
    playT=setTimeout(step,d);
  }
}

// ---------------- packets ----------------
function clearPackets(){ $('packets').replaceChildren(); }
function playFx(fx){
  if (!S.layout || document.hidden) return;
  for (const f of fx){
    const x=S.layout.edgeEls[f.edge]; if (!x||!x.len) continue;
    S.lastEdgeWall=Date.now();
    const w=f.chip.length*6.3+14;
    const g=el('g',{class:'packet'}, el('rect',{x:-w/2,y:-30,width:w,height:17,rx:8}), el('text',{x:0,y:-18,'text-anchor':'middle',text:f.chip}), el('circle',{r:5}));
    $('packets').append(g);
    const dur=Math.max(260, 750/Math.max(1,S.speed)), t0=performance.now();
    (function tick(now){
      const t=Math.min(1,(now-t0)/dur); const p=x.p.getPointAtLength(x.len*(t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2));
      g.setAttribute('transform',`translate(${p.x},${p.y})`);
      if (t<1) requestAnimationFrame(tick); else g.remove();
    })(t0);
    setTimeout(()=>{ if (S.m) paint(); }, 1250);
  }
}

// ---------------- controls ----------------
function postJSON(url,body){ return fetch(url,{method:'POST',headers:{'Content-Type':'application/json','X-Graphweb-Token':BOOT.token},body:JSON.stringify(body)}); }
function control(a){ postJSON(API('control'),{action:a}); }
S.bsDraft = {}; S.toolOpen = new Map();
$('bsbtn').onclick = ()=>{ if (S.bsOpen) bsClose(); else { S.bsOpen=true; S.bsErr=''; panelSig=''; paint(); } };
document.addEventListener('keydown',e=>{ if (e.key==='Escape' && S.bsOpen && S.lb==null) bsClose(); });
function toggleBp(id){ if (S.bps.has(id)) S.bps.delete(id); else S.bps.add(id); paint(); postJSON(API('breakpoints'),{nodes:[...S.bps]}).then(r=>r.json()).then(j=>{ S.bps=new Set(j.nodes); paint(); }); }
$('pausebtn').onclick=()=>control('pause');
$('runsel').onchange=e=>{ S.bsErr=''; S.bsConfirm=false; S.curRun=e.target.value; S.follow=false; $('follow').checked=false; S.cursor=S.events.length; S.sel=null; S.selAuto=true; rebuild(); panelSig=''; paint(); };
const _paint=paint; paint=function(){ _paint();
  const rs=$('runsel'); if (S.runs.length>1){ rs.hidden=false; if (rs.options.length!==S.runs.length){ rs.replaceChildren(...S.runs.map((r,i)=>el('option',{value:r,text:'run '+(i+1)+' · '+r.slice(4,10)}))); } rs.value=S.curRun; } };

// ---------------- board ----------------
// A node of a subgraph is "group/node": inside its group's box the prefix is noise.
function shortId(n){ return (n&&n.group&&n.id.startsWith(n.group+'/')) ? n.id.slice(n.group.length+1) : (n?n.id:''); }
// One model per run, folded incrementally: only the events since the last call are applied.
let boardCache = {len:0, v:{}};
function boardModels(){
  if (boardCache.len>S.events.length) boardCache = {len:0, v:{}};
  const ms = boardCache.v;
  for (let i=boardCache.len;i<S.events.length;i++){ const ev=S.events[i]; if (!ev.run) continue; const m = ms[ev.run]||(ms[ev.run]=newModel(ev.run));
    if (ev.type==='node_end' && !ev.parent && ev.state) m.state = ev.state;
    apply(m, ev, null); }
  boardCache.len = S.events.length; return ms;
}
// What a card shows comes from the run's latest state, by convention: a title-like string,
// a confidence number (0..1 or 0..100) and a tags list. A state without them shows the run id.
const TITLE_KEYS = ['title','task','subject','name','query','prompt','input'];
function cardFacts(st){
  const o = st&&typeof st==='object'&&!Array.isArray(st) ? st : {}, lc = {};
  for (const k in o) lc[k.toLowerCase()] = o[k];
  let title = ''; for (const k of TITLE_KEYS) if (typeof lc[k]==='string' && lc[k].trim()) { title = lc[k].trim(); break; }
  let conf = typeof lc.confidence==='number' && isFinite(lc.confidence) ? lc.confidence : null;
  if (conf!=null && conf<=1) conf *= 100;
  const tags = (Array.isArray(lc.tags)?lc.tags:[]).filter(t=>typeof t==='string'&&t).slice(0,4);
  return {title, conf: conf==null?null:Math.max(0,Math.min(100,Math.round(conf))), tags};
}
// The router is the node whose conditional edge fans out to the most workflows (groups); each of
// its targets is a column: a group, or a plain node (a direct answer, a question to a person).
// Without one, every group is a column. Groups the router does not reach are columns too.
function boardLayout(topo){
  const nodes = topo.nodes||[], byId = {}; nodes.forEach(n=>byId[n.id]=n);
  const colOf = id => { const n = byId[id]; if (!n || n.kind==='end' || n.kind==='start') return null; return n.group ? 'g:'+n.group : 'n:'+id; };
  let best = null;
  for (const n of nodes){
    const outs = (topo.edges||[]).filter(e=>e.from===n.id && e.conditional && !e.watch && !e.back);
    const cols = [...new Set(outs.map(e=>colOf(e.to)).filter(c=>c && c!==colOf(n.id)))];
    const groups = cols.filter(c=>c.startsWith('g:')).length;
    if (cols.length>=2 && groups>=1 && (!best || groups>best.groups || groups===best.groups && cols.length>best.cols.length)) best = {id:n.id, cols, outs, groups};
  }
  const glabel = {}; (topo.groups||[]).forEach(g=>glabel[g.id]=g.label||g.id);
  const cols = [];
  const add = (key, via) => {
    if (cols.some(c=>c.key===key)) return;
    const isG = key.startsWith('g:'), id = key.slice(2), n = byId[id];
    const size = isG ? nodes.filter(x=>x.group===id && !x.parent).length : 1;
    cols.push({key, label: isG ? glabel[id] : shortId(n||{id}), sub: isG ? 'workflow · '+size+' step'+(size===1?'':'s') : (via&&via.label ? via.label : (n&&n.kind==='agent'?'agent':'step')),
      ask: !isG && !!(via&&via.label&&/unsure|human|person|ask|review/i.test(via.label+' '+id)), cards:[]});
  };
  if (best) best.outs.forEach(e=>{ const k = colOf(e.to); if (k && k!==colOf(best.id)) add(k, e); });
  (topo.groups||[]).forEach(g=>add('g:'+g.id));
  return {router: best && byId[best.id], cols, colOf};
}
function openRun(run){
  S.bsErr=''; S.bsConfirm=false; S.curRun=run; S.follow=false; $('follow').checked=false; S.cursor=S.events.length;
  S.sel=null; S.selAuto=true; rebuild(); panelSig=''; setBoard(false);
}
function setBoard(on){
  S.board = on; $('board').hidden = !on; document.querySelector('main').classList.toggle('boardon', on); $('boardbtn').setAttribute('aria-pressed', on);
  S.boardSig = ''; paint();
  if (on) { const c = $('board').querySelector('.bcard.cur') || $('board').querySelector('.bcard'); if (c) c.focus({preventScroll:false}); }
  else $('boardbtn').focus();
}
function boardCard(x, nodeOfId){
  const at = x.m.path[x.m.path.length-1];
  const where = x.m.end ? (x.st==='done'?'finished':x.st) : at ? 'at '+shortId(nodeOfId(at)||{id:at}) : 'starting';
  const dur = x.m.t0!=null ? fmtDur(((x.m.tEnd||x.m.tLast||x.m.t0))-x.m.t0) : '';
  return el('button',{class:'bcard '+x.st+(x.run===S.curRun?' cur':''), type:'button', 'data-run':x.run, title:'open run '+x.run, onclick:()=>openRun(x.run)},
    el('div',{class:'bt'}, el('b',{text:clip(x.f.title||x.run,120)}), el('span',{class:'pill '+x.st, text:(BOOT.labels&&BOOT.labels[x.st])||x.st})),
    x.f.conf!=null ? el('div',{class:'bconf',title:'confidence from the run state'}, el('i',{},el('u',{style:'width:'+x.f.conf+'%'})), el('span',{text:x.f.conf+'%'})) : null,
    x.f.tags.length ? el('div',{class:'btags'}, x.f.tags.map(t=>el('span',{text:clip(t,24)}))) : null,
    el('div',{class:'bmeta'}, el('span',{text:where}), dur?el('span',{text:dur}):null, x.m.cost?el('span',{text:trimCost(x.m.cost)}):null, x.f.title?el('span',{text:x.run.slice(0,14)}):null),
    x.m.end&&x.m.end.err ? el('div',{class:'bmeta'}, el('span',{class:'err',text:clip(x.m.end.err,140)})) : null);
}
const BORDER = {running:0, waiting:1, paused:1, failed:2, error:2, idle:3, done:4};
const stLabel = k => (BOOT.labels&&BOOT.labels[k])||k;
function paintBoard(){
  const topo = S.topo[S.curRun]; const btn = $('boardbtn');
  const same = topo ? S.runs.filter(r=>S.topo[r]&&S.topo[r].name===topo.name) : [];
  btn.hidden = !topo || same.length<2 && !(topo.groups&&topo.groups.length);
  btn.textContent = 'board' + (same.length>1 ? ' · '+same.length : '');
  if (!S.board || !topo) { if (S.board && !topo) setBoard(false); return; }
  const sig = [S.events.length, S.curRun, topo.name].join('|'); if (S.boardSig===sig) return;
  const now = Date.now(); if (S.boardSig && now-(S.boardAt||0)<250) { if (!S.boardT) S.boardT = setTimeout(()=>{ S.boardT=null; paintBoard(); }, 260); return; }
  S.boardSig = sig; S.boardAt = now;
  const ms = boardModels(), L = boardLayout(topo), byKey = {}, hub = [], other = [];
  L.cols.forEach(c=>byKey[c.key]=c);
  same.forEach(run=>{
    const m = ms[run]; if (!m) return;
    const x = {run, m, st:derivedStatus(m), f:cardFacts(m.state||m.initial)};
    let key = null; for (let i=m.path.length-1;i>=0;i--){ const k = L.colOf(m.path[i]); if (k && byKey[k]) { key = k; break; } }
    if (key) byKey[key].cards.push(x); else if (m.end) other.push(x); else hub.push(x);
  });
  if (other.length) L.cols.push({key:'__other', label:'Other', sub:'finished without being routed', cards:other});
  const nodeOfId = id => (topo.nodes||[]).find(n=>n.id===id);
  const sortCards = cs => cs.sort((a,b)=>(BORDER[a.st]??3)-(BORDER[b.st]??3) || (b.m.t0||0)-(a.m.t0||0));
  const routed = L.cols.reduce((n,c)=>n+(c.key==='__other'?0:c.cards.length),0);

  // the router, with the runs it has not routed yet
  let hubEl = null;
  if (L.router){
    sortCards(hub);
    const busy = hub.some(x=>x.st==='running'), waiting = hub.filter(x=>x.st==='waiting'||x.st==='paused').length;
    hubEl = el('section',{class:'bhub bbox'+(busy?' live':'')+(L.cols.length?' haslanes':''),'aria-label':'router '+L.router.id},
      el('div',{class:'bh'}, el('span',{class:'bico','aria-hidden':'true',text:'⑂'}),
        el('span',{class:'tt'}, el('b',{text:shortId(L.router)}), el('small',{text:(L.router.kind==='agent'?'agent':'step')+' · routes to '+L.cols.filter(c=>c.key!=='__other').length})),
        el('span',{class:'pill '+(busy?'running':'idle'), text:busy?stLabel('running'):stLabel('idle')})),
      el('div',{class:'bnow', text: hub.length ? (busy?'Routing: ':'Next: ')+(hub[0].f.title||hub[0].run) : 'Waiting for requests'}),
      el('div',{class:'bmeta'}, el('span',{text:routed+' routed'}), hub.length?el('span',{text:hub.length+' in queue'}):null, waiting?el('span',{text:waiting+' waiting'}):null),
      hub.length ? el('div',{class:'bq'}, hub.slice(0,6).map(x=>boardCard(x,nodeOfId)), hub.length>6?el('div',{class:'bnone',text:'+'+(hub.length-6)+' more'}):null) : null);
  }

  const lanes = L.cols.map(c=>{
    sortCards(c.cards);
    const cnt = {}; c.cards.forEach(x=>cnt[x.st]=(cnt[x.st]||0)+1);
    const active = c.cards.find(x=>x.st==='running') || c.cards.find(x=>x.st==='waiting'||x.st==='paused');
    const last = c.cards.filter(x=>x.m.end).sort((a,b)=>(b.m.tEnd||0)-(a.m.tEnd||0))[0];
    const tot = c.cards.length || 1, pct = k => (100*(cnt[k]||0)/tot).toFixed(1)+'%';
    const open = c.cards.filter(x=>!x.m.end).length;
    const status = active ? active.st : c.cards.length ? 'done' : 'idle';
    return el('section',{class:'blane','aria-label':c.label},
      el('div',{class:'bbox'+(active&&active.st==='running'?' live':'')+(c.ask?' ask':'')},
        el('div',{class:'bh'}, el('span',{class:'bico','aria-hidden':'true',text:c.ask?'?':c.key.startsWith('g:')?'▦':'•'}),
          el('span',{class:'tt'}, el('b',{text:c.label}), el('small',{text:c.sub})),
          el('span',{class:'pill '+status, text:stLabel(status)})),
        el('div',{class:'bnow', text: active ? (active.st==='running'?'Working on ':'Waiting: ')+(active.f.title||active.run) : c.cards.length ? 'Nothing running' : 'Waiting for work'}),
        el('div',{class:'bprog',title:(cnt.done||0)+' done · '+(cnt.failed||0)+' failed · '+open+' open'},
          el('i',{}, el('u',{style:'width:'+pct('done')}), el('s',{style:'width:'+pct('failed')}), el('em',{style:'width:'+(100*open/tot).toFixed(1)+'%'})),
          el('span',{text:(cnt.done||0)+'/'+c.cards.length+' done'+(cnt.failed?' · '+cnt.failed+' failed':'')})),
        el('div',{class:'blast', text:'↳ '+(last ? (last.f.title||last.run)+' · '+(last.st==='done'?'finished':last.st) : 'nothing finished yet')})),
      el('div',{class:'bq'},
        el('div',{class:'bqh'}, el('span',{text:'Tasks'}), el('span',{class:'n',text:String(c.cards.length)})),
        c.cards.length ? c.cards.map(x=>boardCard(x,nodeOfId)) : el('div',{class:'bnone',text:'No tasks yet'})));
  });
  const wrap = el('div',{class:'bwrap'}, hubEl, el('div',{class:'blanes'+(hubEl?' wired':'')}, lanes));
  const b = $('board'), sc = b.scrollTop, sl = b.scrollLeft, fid = document.activeElement && b.contains(document.activeElement) ? document.activeElement.dataset.run : null;
  b.replaceChildren(wrap); b.scrollTop = sc; b.scrollLeft = sl;
  if (fid) { const f = b.querySelector('.bcard[data-run="'+CSS.escape(fid)+'"]') || b.querySelector('.bcard'); if (f) f.focus({preventScroll:true}); }
}
$('boardbtn').onclick = ()=>setBoard(!S.board);
document.addEventListener('keydown',e=>{
  const t = e.target, typing = t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable);
  if (typing || S.lb!=null || S.bsOpen || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key==='Escape' && S.board) { setBoard(false); return; }
  if (e.key==='b' && !e.repeat && !$('boardbtn').hidden) { setBoard(!S.board); return; }
  // Arrows move between cards: up/down in a column, left/right to the next column.
  if (S.board && t && t.classList && t.classList.contains('bcard') && /^Arrow/.test(e.key)) {
    e.preventDefault();
    const col = t.closest('.blane,.bhub'), cards = [...col.querySelectorAll('.bcard')], i = cards.indexOf(t);
    let next = null;
    if (e.key==='ArrowDown') next = cards[i+1]; else if (e.key==='ArrowUp') next = cards[i-1];
    else { let c = col; do { c = e.key==='ArrowRight' ? c.nextElementSibling : c.previousElementSibling; } while (c && c.classList.contains('blane') && !c.querySelector('.bcard'));
      if (c && !c.classList.contains('blane')) c = null;
      if (c) { const cs = c.querySelectorAll('.bcard'); next = cs[Math.min(i, cs.length-1)]; } }
    if (next) next.focus();
  }
});
const _paint2=paint; paint=function(){ _paint2(); paintBoard(); };

// ---------------- boot ----------------
if (!BOOT.readOnly) fetch(API('breakpoints')).then(r=>r.json()).then(j=>{ S.bps=new Set(j.nodes||[]); paint(); }).catch(()=>{});
$('mode').textContent = BOOT.readOnly ? 'replay (read-only)' : 'live';
connect();
</script>
